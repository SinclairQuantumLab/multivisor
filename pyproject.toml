[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["multivisor", "multivisor.*"]
exclude = [
    "multivisor.tests",
    "multivisor.tests.*",
    "multivisor.server.tests",
    "multivisor.server.tests.*",
]

[tool.setuptools.package-data]
"multivisor.server" = ["dist/*", "dist/assets/*"]

[project]
name = "multivisor"
dynamic = ["version"]
authors = [{ name = "Tiago Coutinho", email = "coutinhotiago@gmail.com" }, { name = "Samuel Debionne", email = "samuel.debionne@gmail.com" }]
description = "A centralized supervisor UI (web & CLI)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Boot",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "gevent>=25.9.1",
]

[project.urls]
Repository = "https://github.com/SinclairQuantumLab/multivisor"
Issues = "https://github.com/SinclairQuantumLab/multivisor/issues"
Documentation = "https://github.com/SinclairQuantumLab/multivisor#readme"

[project.scripts]
multivisor = "multivisor.server.web:main"
multivisor-rpc = "multivisor.server.rpc:main"
multivisor-cli = "multivisor.client.cli:main"

[project.optional-dependencies]
rpc = [
    "zerorpc>=0.6.3",
]
web = [
    "blinker>=1.8",
    "flask>=3.0",
    "flask-cors>=5.0",
    "werkzeug>=3.0",
    "zerorpc>=0.6.3",
]
cli = [
    "blinker>=1.8",
    "maya>=0.6.1",
    "prompt-toolkit>=3.0",
    "requests>=2.32",
]
all = [
    "blinker>=1.8",
    "flask>=3.0",
    "flask-cors>=5.0",
    "maya>=0.6.1",
    "prompt-toolkit>=3.0",
    "requests>=2.32",
    "werkzeug>=3.0",
    "zerorpc>=0.6.3",
]
docker = [
    "supervisor>=4.3.0; platform_system != 'Windows'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "requests>=2.32",
    "ruff>=0.12",
]
rpc-test = [
    "supervisor>=4.3.0; platform_system != 'Windows'",
    "supervisor-win>=4.7.0; platform_system == 'Windows' and python_version < '3.13'",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
"multivisor/client/cli.py" = ["E402"]
"multivisor/server/web.py" = ["E402"]
"conftest.py" = ["E402"]
