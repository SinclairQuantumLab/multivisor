name: Python

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Sync the locked environment
        run: uv sync --frozen --extra all

      - name: Check Python modernization rules
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen pytest -q -rs

      - name: Build distributions
        run: uv build --no-sources

  rpc-integration:
    name: RPC / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      MULTIVISOR_REQUIRE_RPC_HOST: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync the RPC integration environment
        run: uv sync --frozen --extra all --group rpc-test

      - name: Run Supervisor/RPC integration tests
        run: uv run --frozen pytest -q

  windows-cross-runtime:
    name: Windows / Python ${{ matrix.central-python }} central + Python 3.12 RPC host
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        central-python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.central-python }}
      MULTIVISOR_REQUIRE_RPC_HOST: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install central and RPC-host Python versions
        run: uv python install ${{ matrix.central-python }} 3.12

      - name: Sync the central environment
        run: uv sync --frozen --extra all

      - name: Create the locked Python 3.12 RPC-host environment
        shell: pwsh
        run: |
          Remove-Item Env:UV_PYTHON
          uv venv --python 3.12 .venv-rpc
          $env:VIRTUAL_ENV = (Resolve-Path .venv-rpc).Path
          uv sync --active --python 3.12 --frozen --extra rpc --no-default-groups --group rpc-test
          "MULTIVISOR_TEST_SUPERVISORD=$((Resolve-Path .venv-rpc\Scripts\supervisord.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MULTIVISOR_TEST_PROCESS_PYTHON=$((Resolve-Path .venv-rpc\Scripts\python.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MULTIVISOR_TEST_RPC_COMMAND=$((Resolve-Path .venv-rpc\Scripts\multivisor-rpc.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run cross-runtime integration tests
        run: uv run --frozen pytest -q
