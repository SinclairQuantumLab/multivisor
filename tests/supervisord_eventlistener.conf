[inet_http_server]
port=:9075

[supervisord]
nodaemon=true

[supervisorctl]
serverurl=http://localhost:9075

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[eventlistener:multivisor-rpc]
command="%(ENV_MULTIVISOR_TEST_RPC_COMMAND)s" --bind 127.0.0.1:9076
events=PROCESS_STATE,TICK_5,SUPERVISOR_STATE_CHANGE_RUNNING

[program:event_probe]
command="%(ENV_MULTIVISOR_TEST_PYTHON)s" -c "import time; time.sleep(60)"
autostart=false
autorestart=false
startsecs=0
